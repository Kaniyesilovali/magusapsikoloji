        label: "İletişim Bilgileri"
        file: _data/contact.json
        fields:
          - name: whatsapp
            label: "WhatsApp Numarası"
            widget: string
            pattern: ['^[0-9]{10,15}$', "Sadece rakam girin, başında + veya 0 olmadan. Örn: 905331234567"]
            hint: "Ülke koduyla, sadece rakam. Örn: 905331234567"
          - { name: phone, label: "Telefon (sitede görünen)", widget: string, hint: "Örn: +90 533 123 45 67" }
          - { name: email, label: "E-posta", widget: string }
          - { name: copyrightYear, label: "© Yılı", widget: string, hint: "Sayfa altbilgisindeki telif yılı. Örn: 2026" }
          - { name: instagram, label: "Instagram", widget: string, hint: "Profil bağlantısının tamamı: https://instagram.com/…" }
          - { name: facebook, label: "Facebook", widget: string, hint: "Profil bağlantısının tamamı: https://facebook.com/…" }
