# Sveltia CMS yapılandırması — magusapsikoloji.com/admin/
#
# Kurulum (tek seferlik, geliştirici):
#  1. GitHub OAuth App oluştur + sveltia-cms-auth Cloudflare Worker'ı deploy et
#     (https://github.com/sveltia/sveltia-cms-auth) ve aşağıdaki base_url'i doldur.
#  2. Müşterinin GitHub hesabını repoya collaborator olarak ekle.
#
# Not: Sveltia CMS, burada listelenmeyen frontmatter alanlarını (SEO şemaları,
# hreflang vb.) kaydederken korur; bu yüzden teknik alanlar bilinçli olarak
# arayüzde gösterilmiyor.

backend:
  name: github
  repo: Kaniyesilovali/magusapsikoloji
  branch: main
  base_url: https://sveltia-cms-auth.kani-09f.workers.dev

site_url: https://magusapsikoloji.com
display_url: https://magusapsikoloji.com
media_folder: assets/images
public_folder: /assets/images

# Sağdaki önizleme paneli ham HTML gösterdiği için kafa karıştırıyor; kapalı.
editor:
  preview: false

collections:
  # ── BLOG ──────────────────────────────────────────────
  - name: blog_tr
    label: "Blog Yazıları (TR)"
    label_singular: "Blog Yazısı (TR)"
    icon: article
    folder: content/tr/blog
    extension: njk
    format: yaml-frontmatter
    create: true
    identifier_field: title
    summary: "{{title}}"
    sortable_fields:
      fields: [datePublished, title]
      default:
        field: datePublished
        direction: descending
    view_groups:
      - label: "Kategoriye Göre"
        field: category
    fields:
      - name: title
        label: "Sayfa Başlığı (SEO)"
        widget: string
        hint: "Google arama sonucunda görünen başlık. İdeal uzunluk 50–60 karakter."
      - name: description
        label: "Meta Açıklama"
        widget: text
        hint: "Google'da başlığın altında görünen kısa açıklama. İdeal uzunluk 140–160 karakter."
      - name: permalink
        label: "Sayfa Adresi (URL)"
        widget: string
        pattern: ['^/blog/[a-z0-9-]+\.html$', "Şu biçimde olmalı: /blog/yazi-adi.html (küçük harf, Türkçe karakter ve boşluk kullanmayın)"]
        hint: "⚠️ Yayınlanmış bir yazının adresini değiştirmeyin — Google sıralaması ve mevcut bağlantılar kırılır. Örn: /blog/yeni-yazi.html"
      - { name: layout, widget: hidden, default: post.njk }
      - name: translationKey
        label: "Çeviri Anahtarı"
        widget: string
        required: false
        hint: "Bu yazının İngilizce sürümüyle eşleşmesini sağlar; iki sürümde de birebir aynı olmalı. Örn: blog/anksiyete-nedir"
      - name: datePublished
        label: "Yayın Tarihi"
        widget: datetime
        format: "YYYY-MM-DD"
        time_format: false
        required: false
      - name: dateModified
        label: "Güncelleme Tarihi"
        widget: datetime
        format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "Yazıda değişiklik yaptığınızda bugünün tarihini seçin."
      - name: category
        label: "Kategori"
        widget: select
        required: false
        options:
          - "Terapi Eğitimi"
          - "Kaygı & Tükenmişlik"
          - "Travma & İyileşme"
          - "Çocuk & Aile"
          - "Çocuk & Ergen"
          - "Öğrenci Ruh Sağlığı"
          - "İlişkiler"
      - name: readingTime
        label: "Okuma Süresi"
        widget: string
        required: false
        hint: "Örn: 6 dk okuma"
      - &hero_field
        name: hero
        label: "Yazı Girişi (Üst Bölüm)"
        widget: object
        required: false
        hint: "Sayfanın en üstü: büyük başlık ve tanıtım cümlesi."
        fields:
          - { name: baslik, label: "Yazı Başlığı", widget: string, hint: "Sayfada görünen büyük başlık. SEO başlığından farklı olabilir (genelde | işaretinden önceki kısım)." }
          - { name: giris, label: "Giriş Paragrafı", widget: text, hint: "Başlığın hemen altındaki 1–2 cümlelik tanıtım." }
          - name: rozetSinifi
            label: "Kategori Rozeti Rengi"
            widget: select
            required: false
            options:
              - { label: "Yeşil (varsayılan)", value: "text-xs bg-primary/10 text-primary font-medium px-3 py-1 rounded-full" }
              - { label: "Kiremit / Turuncu", value: "text-xs bg-accent/10 text-accent font-medium px-3 py-1 rounded-full" }
              - { label: "Adaçayı Yeşili", value: "text-xs bg-sage/20 text-primary font-medium px-3 py-1 rounded-full" }
          - { name: kategori, label: "Kategori Metni (özel)", widget: string, required: false, hint: "Genelde boş bırakın — yukarıdaki Kategori otomatik kullanılır." }
          - { name: okumaSuresi, label: "Okuma Süresi (özel)", widget: string, required: false, hint: "Genelde boş bırakın — yukarıdaki Okuma Süresi otomatik kullanılır." }
      - &blocks_field
        name: blocks
        label: "Yazı İçeriği (Bölümler)"
        label_singular: "Bölüm"
        widget: list
        required: false
        hint: "Yazı alt alta bölümlerden oluşur. 'Bölüm ekle' ile yeni bölüm ekleyin, tutamaçtan sürükleyerek sıralayın."
        types:
          - name: metin
            label: "Metin"
            widget: object
            summary: "{{fields.baslik}}"
            fields:
              - { name: baslik, label: "Bölüm Başlığı", widget: string, required: false }
              - { name: metin, label: "Metin", widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], hint: "Yeni paragraf için satırı boş bırakarak alt satıra geçin." }
          - name: bilgi-kutusu
            label: "Bilgi Kutusu"
            widget: object
            summary: "{{fields.baslik}}"
            fields:
              - name: ton
                label: "Renk"
                widget: select
                default: yesil
                options:
                  - { label: "Yeşil", value: yesil }
                  - { label: "Turuncu / Kiremit", value: turuncu }
              - { name: baslik, label: "Kutu Başlığı", widget: string }
              - { name: metin, label: "Kutu Metni", widget: text }
          - name: onayli-liste
            label: "Onay İşaretli Liste"
            widget: object
            summary: "{{fields.baslik}}"
            fields:
              - { name: baslik, label: "Bölüm Başlığı", widget: string, required: false }
              - { name: giris, label: "Giriş Paragrafı", widget: text, required: false }
              - name: maddeler
                label: "Maddeler"
                label_singular: "Madde"
                widget: list
                fields:
                  - { name: baslik, label: "Madde Başlığı", widget: string }
                  - { name: aciklama, label: "Açıklama", widget: text, required: false }
              - { name: kapanis, label: "Kapanış Notu", widget: text, required: false, hint: "Listenin altında görünen kısa not (isteğe bağlı)." }
          - name: kart-grid
            label: "Yan Yana Kartlar"
            widget: object
            summary: "{{fields.baslik}}"
            fields:
              - { name: baslik, label: "Bölüm Başlığı", widget: string, required: false }
              - { name: giris, label: "Giriş Paragrafı", widget: text, required: false }
              - name: kolon
                label: "Sütun Sayısı"
                widget: select
                default: 3
                options:
                  - { label: "2 sütun", value: 2 }
                  - { label: "3 sütun", value: 3 }
              - name: kartlar
                label: "Kartlar"
                label_singular: "Kart"
                widget: list
                summary: "{{fields.baslik}}"
                fields:
                  - { name: baslik, label: "Kart Başlığı", widget: string }
                  - name: maddeler
                    label: "Maddeler"
                    label_singular: "Madde"
                    widget: list
                    field: { name: madde, label: "Madde", widget: string }
          - name: kart-yigini
            label: "Alt Alta Kartlar"
            widget: object
            summary: "{{fields.baslik}}"
            fields:
              - { name: baslik, label: "Bölüm Başlığı", widget: string, required: false }
              - { name: giris, label: "Giriş Paragrafı", widget: text, required: false }
              - name: kartlar
                label: "Kartlar"
                label_singular: "Kart"
                widget: list
                summary: "{{fields.baslik}}"
                fields:
                  - { name: baslik, label: "Kart Başlığı", widget: string }
                  - { name: metin, label: "Kart Metni", widget: text }
          - name: numarali-liste
            label: "Numaralı Liste"
            widget: object
            summary: "{{fields.baslik}}"
            fields:
              - { name: baslik, label: "Bölüm Başlığı", widget: string, required: false }
              - { name: giris, label: "Giriş Paragrafı", widget: text, required: false }
              - name: stil
                label: "Numara Stili"
                widget: select
                default: acik
                options:
                  - { label: "Açık yeşil daire", value: acik }
                  - { label: "Koyu yeşil daire", value: koyu }
              - name: maddeler
                label: "Maddeler"
                label_singular: "Madde"
                widget: list
                field: { name: madde, label: "Madde", widget: string }
              - { name: kapanis, label: "Kapanış Notu", widget: text, required: false }
          - name: adimlar
            label: "Numaralı Adımlar (başlıklı)"
            widget: object
            summary: "{{fields.baslik}}"
            fields:
              - { name: baslik, label: "Bölüm Başlığı", widget: string, required: false }
              - { name: giris, label: "Giriş Paragrafı", widget: text, required: false }
              - name: adimlar
                label: "Adımlar"
                label_singular: "Adım"
                widget: list
                summary: "{{fields.baslik}}"
                fields:
                  - { name: baslik, label: "Adım Başlığı", widget: string }
                  - { name: metin, label: "Adım Açıklaması", widget: text }
          - name: ozel
            label: "Özel Tasarım Bölümü (teknik)"
            widget: object
            fields:
              - name: html
                label: "HTML"
                widget: code
                default_language: html
                output_code_only: true
                allow_language_selection: false
                hint: "Bu bölüm özel tasarımlıdır. Metinleri etiketlerin ARASINDA düzenleyin; etiketleri silmeyin."
      - &legacy_body_field
        name: body
        label: "Özel HTML Gövde (teknik)"
        widget: code
        required: false
        default_language: html
        output_code_only: true
        allow_language_selection: false
        hint: "Yalnızca özel sayfalarda doludur (blog dizini gibi). Bölüm kullanan yazılarda boş kalmalıdır."
      - name: card
        label: "Blog Listesi Kartı"
        widget: object
        required: false
        collapsed: true
        hint: "Blog ana sayfasındaki kart görünümü. Boş bırakılan alanlar yukarıdaki bilgilerden otomatik doldurulur."
        fields:
          - { name: title, label: "Kart Başlığı", widget: string, required: false, hint: "Boş bırakılırsa sayfa başlığı kullanılır. Kartta kısa başlık daha iyi durur." }
          - { name: excerpt, label: "Kart Özeti", widget: text, required: false, hint: "Kartta görünen 1–2 cümlelik özet." }
          - name: category
            label: "Kart Kategorisi"
            widget: select
            required: false
            hint: "Boş bırakılırsa yukarıdaki Kategori kullanılır."
            options:
              - "Terapi Eğitimi"
              - "Kaygı & Tükenmişlik"
              - "Travma & İyileşme"
              - "Çocuk & Aile"
              - "Çocuk & Ergen"
              - "Öğrenci Ruh Sağlığı"
              - "İlişkiler"
          - { name: readingTime, label: "Kart Okuma Süresi", widget: string, required: false, hint: "Boş bırakılırsa yukarıdaki Okuma Süresi kullanılır." }
          - { name: emoji, label: "Emoji", widget: string, required: false, hint: "Kartın üst kısmında büyük görünen emoji. Örn: 🧠" }
          - name: gradientClass
            label: "Kart Arka Plan Rengi"
            widget: select
            required: false
            options: &gradient_options
              - { label: "Yeşil → Adaçayı (varsayılan)", value: "h-44 bg-gradient-to-br from-primary/10 to-sage/15 flex items-center justify-center text-5xl" }
              - { label: "Yeşil → Adaçayı (daha açık)", value: "h-44 bg-gradient-to-br from-primary/10 to-sage/12 flex items-center justify-center text-5xl" }
              - { label: "Açık Yeşil → Adaçayı", value: "h-44 bg-gradient-to-br from-primary/8 to-sage/20 flex items-center justify-center text-5xl" }
              - { label: "Yeşil → Kiremit", value: "h-44 bg-gradient-to-br from-primary/10 to-accent/10 flex items-center justify-center text-5xl" }
              - { label: "Açık Yeşil → Kiremit", value: "h-44 bg-gradient-to-br from-primary/8 to-accent/10 flex items-center justify-center text-5xl" }
              - { label: "Yeşil → Bej", value: "h-44 bg-gradient-to-br from-primary/10 to-warm-tertiary flex items-center justify-center text-5xl" }
              - { label: "Kiremit → Yeşil", value: "h-44 bg-gradient-to-br from-accent/10 to-primary/8 flex items-center justify-center text-5xl" }
              - { label: "Kiremit → Adaçayı", value: "h-44 bg-gradient-to-br from-accent/8 to-sage/15 flex items-center justify-center text-5xl" }
              - { label: "Kiremit → Bej", value: "h-44 bg-gradient-to-br from-accent/8 to-warm-tertiary flex items-center justify-center text-5xl" }
              - { label: "Adaçayı → Yeşil", value: "h-44 bg-gradient-to-br from-sage/20 to-primary/8 flex items-center justify-center text-5xl" }
              - { label: "Adaçayı → Kiremit", value: "h-44 bg-gradient-to-br from-sage/15 to-accent/8 flex items-center justify-center text-5xl" }
              - { label: "Adaçayı (koyu) → Kiremit", value: "h-44 bg-gradient-to-br from-sage/20 to-accent/8 flex items-center justify-center text-5xl" }
          - name: badgeClass
            label: "Kategori Rozeti Rengi"
            widget: select
            required: false
            options: &badge_options
              - { label: "Yeşil (varsayılan)", value: "text-xs bg-primary/10 text-primary font-medium px-2.5 py-0.5 rounded-full" }
              - { label: "Kiremit / Turuncu", value: "text-xs bg-accent/10 text-accent font-medium px-2.5 py-0.5 rounded-full" }
              - { label: "Adaçayı Yeşili", value: "text-xs bg-sage/20 text-primary font-medium px-2.5 py-0.5 rounded-full" }
      - name: cardOrder
        label: "Kart Sırası"
        widget: number
        required: false
        hint: "Blog listesindeki sıralama. Küçük sayı daha üstte görünür; boş bırakılırsa en üstte."
      - name: faqTopic
        label: "SSS Konusu"
        widget: select
        required: false
        hint: "Yazının altında gösterilecek hazır soru-cevap akordiyonunun konusu."
        options:
          - { label: "Kaygı", value: kaygi }
          - { label: "Depresyon", value: depresyon }
          - { label: "Panik Atak", value: panik-atak }
          - { label: "DEHB", value: dehb }
          - { label: "EMDR Terapisi", value: emdr }
          - { label: "Terapiye Ne Zaman Gidilmeli", value: terapiye-ne-zaman }
          - { label: "Terapiye Başlamadan Önce", value: terapiye-baslamadan }
          - { label: "Psikolog mu Psikiyatrist mi", value: psikolog-psikiyatrist }
          - { label: "Öğrenci Kaygısı", value: ogrenci-kaygisi }
          - { label: "Kuzey Kıbrıs'ta Destek", value: kuzey-kibris }
          - { label: "Çift Terapisi", value: cift-terapisi }
          - { label: "Aile Terapisi", value: aile-terapisi }
      - name: faq
        label: "Google SSS Şeması"
        widget: list
        required: false
        collapsed: true
        hint: "Bu yazıya özel soru-cevaplar; Google arama sonuçlarında yazının altında görünebilir."
        fields: &faq_fields
          - { name: q, label: "Soru", widget: string }
          - { name: a, label: "Cevap", widget: text }
      - name: related
        label: "İlgili Yazılar"
        widget: list
        required: false
        collapsed: true
        hint: "Yazının sonunda önerilen diğer yazılar."
        fields: &related_fields
          - { name: url, label: "Bağlantı", widget: string, hint: "Örn: /blog/depresyon-nedir.html" }
          - { name: category, label: "Kategori Etiketi", widget: string }
          - { name: title, label: "Başlık", widget: string }
      - { name: relatedHeading, label: "İlgili Yazılar Başlığı", widget: string, required: false, hint: "Örn: Bunlar da ilginizi çekebilir" }
      - name: cta
        label: "Sayfa Sonu Çağrısı (CTA)"
        widget: object
        required: false
        collapsed: true
        hint: "Yazının en altındaki renkli randevu/iletişim kutusu."
        fields: &cta_fields
          - { name: heading, label: "Başlık", widget: string }
          - { name: sub, label: "Alt Metin", widget: string }
          - { name: label, label: "Düğme Yazısı", widget: string }
          - { name: href, label: "Düğme Bağlantısı", widget: string, hint: "Örn: /iletisim.html veya https://wa.me/905…" }
          - { name: external, label: "Yeni sekmede aç", widget: boolean, required: false }
  - name: blog_en
    label: "Blog Posts (EN)"
    label_singular: "Blog Post (EN)"
    icon: translate
    folder: content/en/blog
    extension: njk
    format: yaml-frontmatter
    create: true
    identifier_field: title
    summary: "{{title}}"
    sortable_fields:
      fields: [datePublished, title]
      default:
        field: datePublished
        direction: descending
    view_groups:
      - label: "Kategoriye Göre"
        field: category
    fields:
      - name: title
        label: "Sayfa Başlığı (SEO)"
        widget: string
        hint: "Google arama sonucunda görünen başlık. İdeal uzunluk 50–60 karakter."
      - name: description
        label: "Meta Açıklama"
        widget: text
        hint: "Google'da başlığın altında görünen kısa açıklama. İdeal uzunluk 140–160 karakter."
      - name: permalink
        label: "Sayfa Adresi (URL)"
        widget: string
        pattern: ['^/en/blog/[a-z0-9-]+\.html$', "Şu biçimde olmalı: /en/blog/post-name.html (küçük harf, boşluksuz)"]
        hint: "⚠️ Yayınlanmış bir yazının adresini değiştirmeyin. Örn: /en/blog/new-post.html"
      - { name: layout, widget: hidden, default: post.njk }
      - name: translationKey
        label: "Çeviri Anahtarı"
        widget: string
        required: false
        hint: "Bu yazının Türkçe sürümüyle eşleşmesini sağlar; iki sürümde de birebir aynı olmalı."
      - name: datePublished
        label: "Yayın Tarihi"
        widget: datetime
        format: "YYYY-MM-DD"
        time_format: false
        required: false
      - name: dateModified
        label: "Güncelleme Tarihi"
        widget: datetime
        format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "Yazıda değişiklik yaptığınızda bugünün tarihini seçin."
      - name: category
        label: "Kategori"
        widget: select
        required: false
        options: &category_options_en
          - "Therapy Guide"
          - "Anxiety & Burnout"
          - "Children & Family"
          - "Children & Adolescents"
          - "Student Mental Health"
          - "Relationships"
      - name: readingTime
        label: "Okuma Süresi"
        widget: string
        required: false
        hint: "Örn: 6 min read"
      - *hero_field
      - *blocks_field
      - *legacy_body_field
      - name: card
        label: "Blog Listesi Kartı"
        widget: object
        required: false
        collapsed: true
        hint: "Blog ana sayfasındaki kart görünümü. Boş bırakılan alanlar yukarıdaki bilgilerden otomatik doldurulur."
        fields:
          - { name: title, label: "Kart Başlığı", widget: string, required: false, hint: "Boş bırakılırsa sayfa başlığı kullanılır." }
          - { name: excerpt, label: "Kart Özeti", widget: text, required: false }
          - name: category
            label: "Kart Kategorisi"
            widget: select
            required: false
            hint: "Boş bırakılırsa yukarıdaki Kategori kullanılır."
            options: *category_options_en
          - { name: readingTime, label: "Kart Okuma Süresi", widget: string, required: false, hint: "Boş bırakılırsa yukarıdaki Okuma Süresi kullanılır." }
          - { name: emoji, label: "Emoji", widget: string, required: false, hint: "Kartın üst kısmında büyük görünen emoji. Örn: 🧠" }
          - name: gradientClass
            label: "Kart Arka Plan Rengi"
            widget: select
            required: false
            options: *gradient_options
          - name: badgeClass
            label: "Kategori Rozeti Rengi"
            widget: select
            required: false
            options: *badge_options
      - name: cardOrder
        label: "Kart Sırası"
        widget: number
        required: false
        hint: "Blog listesindeki sıralama. Küçük sayı daha üstte görünür; boş bırakılırsa en üstte."
      - name: faqTopic
        label: "SSS Konusu"
        widget: select
        required: false
        hint: "Yazının altında gösterilecek hazır soru-cevap akordiyonunun konusu."
        options:
          - { label: "Anxiety", value: anxiety }
          - { label: "Depression", value: depression }
          - { label: "Panic Attack", value: panic-attack }
          - { label: "ADHD", value: adhd }
          - { label: "EMDR Therapy", value: emdr }
          - { label: "When to Start Therapy", value: when-therapy }
          - { label: "Before Starting Therapy", value: before-therapy }
          - { label: "Psychologist vs Psychiatrist", value: psychologist-psychiatrist }
          - { label: "Exam Anxiety", value: exam-anxiety }
          - { label: "Student Wellbeing", value: student-wellbeing }
          - { label: "Support in North Cyprus", value: north-cyprus }
          - { label: "Couples Therapy", value: couples-therapy }
          - { label: "Family Therapy", value: family-therapy }
          - { label: "Online Therapy", value: online-therapy }
          - { label: "Finding a Psychologist", value: find-psychologist }
      - name: faq
        label: "Google SSS Şeması"
        widget: list
        required: false
        collapsed: true
        hint: "Bu yazıya özel soru-cevaplar; Google arama sonuçlarında yazının altında görünebilir."
        fields: *faq_fields
      - name: related
        label: "İlgili Yazılar"
        widget: list
        required: false
        collapsed: true
        hint: "Yazının sonunda önerilen diğer yazılar."
