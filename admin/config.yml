                  - { name: title, label: "Kategori Başlığı", widget: string }
                  - name: items
                    label: "Sorular"
                    widget: list
                    summary: "{{fields.q}}"
                    fields:
                      - { name: q, label: "Soru", widget: string }
                      - { name: a, label: "Cevap", widget: text }
              - name: en
                label: "İngilizce Sorular"
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - { name: id, label: "Bölüm ID (teknik)", widget: string, hint: "Sayfa içi bağlantı için; küçük harf ve tire. Örn: therapy-process" }
                  - { name: title, label: "Kategori Başlığı", widget: string }
                  - name: items
                    label: "Sorular"
                    widget: list
                    summary: "{{fields.q}}"
                    fields:
